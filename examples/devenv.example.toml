# Конфигурация локального окружения разработки
# Этот файл должен находиться в корне вашего проекта

# Конфигурация сервиса учетных данных
[creds]
enabled = true
endpoint = "localhost:50051"
# Список сервисов, для которых нужно получить учетные данные
services = [
    "notification",
    "user",
    "community"
]

# Маппинг переменных окружения
# Используется для копирования значений из одних переменных в другие
[[env_maps]]
from = "POSTGRES_USER"     # Исходная переменная
to = "MATERIALS_SERVICE_POSTGRES_USER"  # Целевая переменная

[[env_maps]]
from = "POSTGRES_PASSWORD"
to = "MATERIALS_SERVICE_POSTGRES_PASSWORD"

[[env_maps]]
from = "POSTGRES_DB"
to = "MATERIALS_SERVICE_POSTGRES_DB"

# Переменные окружения
[env]
# Базовые настройки
APP_ENV = "local"
APP_DEBUG = "true"
APP_PORT = "8080"

# Настройки сервисов
POSTGRES_USER = "postgres"
POSTGRES_PASSWORD = "postgres"
POSTGRES_DB = "app"
POSTGRES_PORT = "5432"
KAFKA_PORT = "9092"
REDPANDA_CONSOLE_PORT = "18080"

# Инфраструктурные сервисы
[services.postgres]
enabled = true

[services.redis]
enabled = true

[services.redpanda]
enabled = true
# Список топиков для автоматического создания (опционально)
topics = [
    { name = "notifications", partitions = 3, replication_factor = 1 },
    { name = "user-events", partitions = 3, replication_factor = 1 },
    { name = "community-events", partitions = 3, replication_factor = 1 }
]

[services.redpanda_console]
enabled = true  # Включает Redpanda Console UI на http://localhost:18080