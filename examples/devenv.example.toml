# Конфигурация локального окружения разработки
# Этот файл должен находиться в корне вашего проекта

# Конфигурация PostgreSQL
[services.postgres]
# Включить/выключить сервис
enabled = true
# Версия образа postgres (рекомендуется использовать конкретную версию)
version = "15"
# Порт, на котором будет доступен PostgreSQL (будет прокинут на хост-машину)
port = 5432
# Пользователь базы данных
user = "postgres"
# Пароль пользователя
password = "postgres"
# Имя базы данных, которая будет создана при первом запуске
database = "app"

# Конфигурация Redis
[services.redis]
# Включить/выключить сервис
enabled = true
# Версия образа redis (alpine - легковесная версия)
version = "alpine"
# Порт, на котором будет доступен Redis
port = 6379

# Конфигурация Redpanda (совместима с Kafka)
[services.redpanda]
# Включить/выключить сервис
enabled = true
# Версия образа redpanda
version = "latest"
# Основной порт для Kafka API
port = 9092
# Дополнительный порт для Admin API (9644) будет прокинут автоматически
